name: Build Sely APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the project
      - name: Checkout Sely project
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install the SDK required by Sely
      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # 5. Accept Android licenses
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 6. Enable AndroidX
      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      # 7. Install Gradle 8.2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 8. Check project
      - name: Check project files
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "===== APP ====="
          ls -la app
          echo "===== JAVA/KOTLIN ====="
          find app/src/main -type f

      # 9. Build debug APK
      - name: Build Sely APK
        run: gradle assembleDebug --stacktrace

      # 10. Confirm APK exists
      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # 11. Upload APK to GitHub Actions
      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 12. Create a GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
